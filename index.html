<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ramito Hot Wheels</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">

        <h1>🏎️💐 Ramito Especial 💐🏎️</h1>

        <p class="mensaje">
            Un pequeño detalle hecho con mucho cariño ❤️
        </p>

        <!-- RAMO -->
        <div class="ramo">

            <!-- FLORES -->
            <div class="flor flor1">🌹</div>
            <div class="flor flor2">🌸</div>
            <div class="flor flor3">🌹</div>
            <div class="flor flor4">🌷</div>

            <!-- TALLOS -->
            <div class="tallo tallo1"></div>
            <div class="tallo tallo2"></div>
            <div class="tallo tallo3"></div>
            <div class="tallo tallo4"></div>
            <div class="tallo tallo5"></div>

            <!-- CARRITO 1 -->
            <div class="carrito carrito1">
                <div class="auto rojo">
                    <div class="techo"></div>
                    <div class="vidrio"></div>
                    <div class="rueda rueda-izq"></div>
                    <div class="rueda rueda-der"></div>
                    <div class="luz"></div>
                </div>
            </div>

            <!-- CARRITO 2 -->
            <div class="carrito carrito2">
                <div class="auto azul">
                    <div class="techo"></div>
                    <div class="vidrio"></div>
                    <div class="rueda rueda-izq"></div>
                    <div class="rueda rueda-der"></div>
                    <div class="luz"></div>
                </div>
            </div>

            <!-- CARRITO 3 -->
            <div class="carrito carrito3">
                <div class="auto amarillo">
                    <div class="techo"></div>
                    <div class="vidrio"></div>
                    <div class="rueda rueda-izq"></div>
                    <div class="rueda rueda-der"></div>
                    <div class="luz"></div>
                </div>
            </div>

            <!-- CARRITO 4 -->
            <div class="carrito carrito4">
                <div class="auto verde">
                    <div class="techo"></div>
                    <div class="vidrio"></div>
                    <div class="rueda rueda-izq"></div>
                    <div class="rueda rueda-der"></div>
                    <div class="luz"></div>
                </div>
            </div>

            <!-- CARRITO 5 -->
            <div class="carrito carrito5">
                <div class="auto negro">
                    <div class="techo"></div>
                    <div class="vidrio"></div>
                    <div class="rueda rueda-izq"></div>
                    <div class="rueda rueda-der"></div>
                    <div class="luz"></div>
                </div>
            </div>

            <!-- PAPEL DEL RAMO -->
            <div class="papel">
                <div class="pliegue pliegue1"></div>
                <div class="pliegue pliegue2"></div>
                <div class="pliegue pliegue3"></div>
            </div>

            <!-- MOÑO -->
            <div class="moño">
                🎀
            </div>

            <!-- BRILLITOS -->
            <div class="brillo brillo1">✨</div>
            <div class="brillo brillo2">✨</div>
            <div class="brillo brillo3">⭐</div>
            <div class="brillo brillo4">✨</div>

        </div>

        <!-- BOTÓN -->
        <button id="boton">
            ✨ Ver sorpresa ✨
        </button>

        <p id="sorpresa"></p>

    </div>

    <script src="script.js"></script>

</body>

</html>
